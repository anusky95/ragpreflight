[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragpreflight"
version = "0.1.1"
description = "Pre-ingestion diagnostic for RAG knowledge bases, grounded in the Garani 2026 taxonomy of 33 RAG failure modes"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anupama Garani", email = "anupamagarani95@gmail.com" }]
keywords = ["rag", "llm", "document-quality", "nlp", "retrieval", "embeddings", "rag-failure-modes", "garani-2026-taxonomy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "pymupdf>=1.24.0",
    "pdfplumber>=0.10.0",
    "charset-normalizer>=3.3.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-docx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "langdetect>=1.0.9",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
full = [
    "sentence-transformers>=3.0.0",
    "datasketch>=2.0.0",
]
llm = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-beautifulsoup4",
    "types-openpyxl",
]

[project.scripts]
ragpreflight = "ragpreflight.cli:main"

[project.urls]
Homepage = "https://github.com/anusky95/ragpreflight"
Documentation = "https://github.com/anusky95/ragpreflight#readme"
Repository = "https://github.com/anusky95/ragpreflight"
"Bug Tracker" = "https://github.com/anusky95/ragpreflight/issues"
"Paper" = "https://aclanthology.org/2026.trustnlp-main.27/"

[tool.hatch.build.targets.wheel]
packages = ["src/ragpreflight"]

[tool.hatch.build.targets.wheel.force-include]
"src/ragpreflight/taxonomy/garani_2026.yaml" = "ragpreflight/taxonomy/garani_2026.yaml"

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
markers = [
    "slow: marks tests that load sentence-transformers models (skip with -m 'not slow')",
]
