[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragpreflight"
version = "0.3.0"
description = "Lint your knowledge before your agent reads it. Offline checks for stale versions, conflicting facts, broken extraction, risky chunk splits and PII — for RAG, LLM wikis and OKF."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anupama Garani" }]
keywords = ["rag", "llm", "agents", "knowledge-base", "llm-wiki", "okf", "data-quality", "lint", "retrieval", "rag-failure-modes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pypdfium2>=4.30",
    "pypdf>=4.0",
    "python-docx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
chat = ["anthropic>=0.70"]  # Claude answers in `ragpreflight ab` / `demo --chat`
chunkers = ["langchain-text-splitters>=0.3", "tiktoken>=0.7"]  # real LangChain splitter + exact token windows

[project.scripts]
ragpreflight = "ragpreflight.cli:main"

[project.urls]
Homepage = "https://github.com/anusky95/ragpreflight"
Repository = "https://github.com/anusky95/ragpreflight"
Issues = "https://github.com/anusky95/ragpreflight/issues"
Paper = "https://aclanthology.org/2026.trustnlp-main.27/"

[tool.hatch.build.targets.wheel]
packages = ["src/ragpreflight"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM102", "SIM103", "SIM105", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
