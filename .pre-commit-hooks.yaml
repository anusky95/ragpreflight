- id: ragpreflight-scan
  name: ragpreflight — document readiness gate
  description: Fail the commit if any staged document scores below the standard threshold (60).
  language: python
  entry: ragpreflight score --min-score 60
  types_or: [pdf, file]
  args: []
  pass_filenames: true
  stages: [pre-commit]

- id: ragpreflight-scan-strict
  name: ragpreflight — strict document readiness gate
  description: Fail the commit if any staged document scores below the strict threshold (80).
  language: python
  entry: ragpreflight score --min-score 80
  types_or: [pdf, file]
  args: []
  pass_filenames: true
  stages: [pre-commit]
