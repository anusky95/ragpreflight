# Use ragpreflight as a pre-commit hook. In your .pre-commit-config.yaml:
#
#   - repo: https://github.com/anusky95/ragpreflight
#     rev: v0.3.0
#     hooks:
#       - id: ragpreflight          # block commits that add documents with errors
#
# Version-conflict checks compare documents with each other, so the hook scans the
# whole knowledge-base folder you point it at (default: the repo root), not only staged files.

- id: ragpreflight
  name: ragpreflight — knowledge-base lint
  description: Block commits when documents have stale versions, conflicts, scanned pages, PII or secrets.
  language: python
  entry: ragpreflight scan --fail-on error
  files: '\.(pdf|docx|md|markdown|txt|html?)$'
  pass_filenames: false
  args: ["."]
